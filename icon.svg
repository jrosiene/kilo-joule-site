<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- kilo-joule: a mitochondrion whose cristae are an interval power trace.
       scripts/make_icons.py renders the PNG and Android icons from this geometry. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13263f"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) rotate(-28)">
    <!-- outer membrane -->
    <rect x="-390" y="-215" width="780" height="430" rx="215" fill="#14b8a6" fill-opacity="0.12"
          stroke="url(#teal)" stroke-width="36"/>
    <!-- inner membrane / cristae drawn as an interval power trace -->
    <path d="M -300 85 H -225 V -105 H -120 V 85 H -70 V -105 H 35 V 85 H 85 V -105 H 190 V 85 H 300"
          fill="none" stroke="#5eead4" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
